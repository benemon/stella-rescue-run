# nginx configuration for Stella's Rescue Run
# Optimized for offline-first PWA with proper MIME types and caching

worker_processes auto;
error_log /dev/stderr notice;
pid /tmp/nginx.pid;

events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    # Ensure JavaScript modules have correct MIME type
    types {
        application/javascript js mjs;
    }

    log_format main '$remote_addr - $remote_user [$time_local] "$request" '
                    '$status $body_bytes_sent "$http_referer" '
                    '"$http_user_agent" "$http_x_forwarded_for"';

    access_log /dev/stdout main;

    sendfile on;
    tcp_nopush on;
    tcp_nodelay on;
    keepalive_timeout 65;
    types_hash_max_size 2048;

    # Gzip compression
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types text/plain text/css text/xml text/javascript application/json application/javascript application/xml+rss application/rss+xml font/truetype font/opentype application/vnd.ms-fontobject image/svg+xml;

    server {
        listen 8080;
        server_name _;

        root /usr/share/nginx/html;
        index index.html;

        # Security headers
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-XSS-Protection "1; mode=block" always;

        # Service Worker and index.html: no-cache (always revalidate)
        location = /sw.js {
            add_header Cache-Control "no-cache, must-revalidate";
            add_header Content-Type "application/javascript";
        }

        location = /index.html {
            add_header Cache-Control "no-cache, must-revalidate";
        }

        location = / {
            add_header Cache-Control "no-cache, must-revalidate";
        }

        # Static assets: immutable, long-term cache
        location /assets/ {
            add_header Cache-Control "public, max-age=31536000, immutable";
        }

        location /js/ {
            add_header Cache-Control "public, max-age=31536000, immutable";
            add_header Content-Type "application/javascript";
        }

        # CSS
        location ~* \.css$ {
            add_header Cache-Control "public, max-age=31536000, immutable";
        }

        # Fonts
        location ~* \.(woff2|woff|ttf|eot)$ {
            add_header Cache-Control "public, max-age=31536000, immutable";
            add_header Access-Control-Allow-Origin "*";
        }

        # Fallback to index.html for SPA routing
        location / {
            try_files $uri $uri/ /index.html;
        }

        # Health check endpoint
        location /health {
            access_log off;
            return 200 "healthy\n";
            add_header Content-Type text/plain;
        }
    }
}
