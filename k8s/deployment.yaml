apiVersion: apps/v1
kind: Deployment
metadata:
  name: stella-rescue
  labels:
    app: stella-rescue
spec:
  replicas: 1
  selector:
    matchLabels:
      app: stella-rescue
  template:
    metadata:
      labels:
        app: stella-rescue
    spec:
      containers:
      - name: stella-rescue
        # Replace with your registry URL and tag
        image: your-registry/stella-rescue:latest
        ports:
        - containerPort: 8080
          protocol: TCP
        livenessProbe:
          httpGet:
            path: /health
            port: 8080
          initialDelaySeconds: 10
          periodSeconds: 30
        readinessProbe:
          httpGet:
            path: /health
            port: 8080
          initialDelaySeconds: 5
          periodSeconds: 10
        resources:
          requests:
            memory: "64Mi"
            cpu: "50m"
          limits:
            memory: "128Mi"
            cpu: "200m"
        securityContext:
          allowPrivilegeEscalation: false
          runAsNonRoot: true
          capabilities:
            drop:
            - ALL
          seccompProfile:
            type: RuntimeDefault
